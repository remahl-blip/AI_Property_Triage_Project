version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: property_triage_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - triage_network

  property_triage:
    build: ./code_Property_Triage
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres_db:5432/property_triage_db
    depends_on:
      - postgres_db
    networks:
      - triage_network

  image_analyser:
    build: ./code_Image_Analyser
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      - property_triage
    networks:
      - triage_network

  property_agent:
    build: ./code_LangGraph_Agent
    ports:
      - "8004:8004"
    env_file:
      - .env
    environment:
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      - property_triage
    networks:
      - triage_network

  frontend_ui:
    build: ./code_Frontend_UI
    ports:
      - "8501:8501"
    depends_on:
      - image_analyser
      - property_agent
    networks:
      - triage_network

networks:
  triage_network:
    driver: bridge

volumes:
  postgres_data: