services:
  postgres_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: property_triage_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - triage_network

  property_triage:
    build: ./code_Property_Triage
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres_db:5432/property_triage_db
    depends_on:
      - postgres_db
    networks:
      - triage_network

  image_analyser:
    build: ./code_Image_Analyser
    ports:
      - "8002:8002"
    environment:
      - TRIAGE_SERVICE_URL=http://property_triage:8003/triage
    depends_on:
      - property_triage
    networks:
      - triage_network

  frontend_ui:
    build: ./code_Frontend_UI
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - image_analyser
      - property_triage
    networks:
      - triage_network

networks:
  triage_network:
    driver: bridge

volumes:
  postgres_data:
