services:
  postgres_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: property_triage_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - triage_network

  property_triage:
    build: ./code_Property_Triage
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres_db:5432/property_triage_db
    depends_on:
      - postgres_db
    networks:
      - triage_network

  rag_service:
    build: ./code_RAG_Service
    ports:
      - "8001:8001"
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-120}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - triage_network

  guardrails_service:
    build: ./code_Guardrails_Service
    ports:
      - "8005:8005"
    networks:
      - triage_network

  image_analyser:
    build: ./code_Image_Analyser
    ports:
      - "8002:8002"
    environment:
      - TRIAGE_SERVICE_URL=http://property_triage:8003/triage
    depends_on:
      - property_triage
    networks:
      - triage_network

  langgraph_agent:
    build: ./code_LangGraph_Agent
    ports:
      - "8004:8004"
    environment:
      - RAG_SERVICE_URL=http://rag_service:8001
      - IMAGE_ANALYSER_URL=http://image_analyser:8002
      - TRIAGE_SERVICE_URL=http://property_triage:8003
    depends_on:
      - rag_service
      - image_analyser
      - property_triage
    networks:
      - triage_network

  llm_service:
    build: ./code_LLM_Service
    ports:
      - "8006:8006"
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-120}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - triage_network

  frontend_ui:
    build: ./code_Frontend_UI
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-120}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - image_analyser
      - property_triage
      - rag_service
      - langgraph_agent
    networks:
      - triage_network

  n8n:
    image: n8nio/n8n:1.76.1
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_data:/home/node/.n8n
      - ./code_Layer1_2_WebUI_n8n/orchestration/workflows:/import:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if [ ! -f /home/node/.n8n/.property_triage_workflow_imported ] && [ -f /import/property_triage_workflow.json ]; then
          echo "Importing n8n workflow"
          n8n import:workflow --input=/import/property_triage_workflow.json && touch /home/node/.n8n/.property_triage_workflow_imported
        fi
        WF_ID=$$(n8n list:workflow 2>/dev/null | grep "Property Triage Orchestration" | cut -d'|' -f1)
        if [ -n "$$WF_ID" ]; then
          echo "Activating workflow $$WF_ID"
          n8n update:workflow --id="$$WF_ID" --active=true
        fi
        exec n8n start
    depends_on:
      - guardrails_service
      - rag_service
      - image_analyser
      - langgraph_agent
      - llm_service
      - property_triage
    networks:
      - triage_network

  layer1_webui:
    build: ./code_Layer1_2_WebUI_n8n
    ports:
      - "8502:8501"
    environment:
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/property-triage
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
      - REQUEST_TIMEOUT_SECONDS=60
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - n8n
    networks:
      - triage_network

networks:
  triage_network:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
